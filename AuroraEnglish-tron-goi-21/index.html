:root {
  --bg: #FFF8EE;
  --paper: #FFFFFF;
  --ink: #3B2A3A;
  --ink2: #75606F;
  --ink3: #A8949F;
  --line: #F2DDE3;
  --line2: #EBCFD8;
  --pink: #F2558B;
  --pink-dk: #C93A6C;
  --pink-soft: #FFE6EE;
  --pink-mid: #FFC2D4;
  --yel: #FFD24D;
  --yel-dk: #E0A915;
  --yel-soft: #FFF4CF;
  --yel-mid: #FFE494;
  --yel-ink: #6B4A00;
  --mint: #2FB383;
  --mint-dk: #1E8A63;
  --mint-soft: #DDF6EC;
  --red: #EF5B5B;
  --red-dk: #C53D3D;
  --red-soft: #FFE4E2;
  --sky: #4FA9F0;
  --sky-soft: #E2F1FD;
  --lav: #9B7BF0;
  --lav-soft: #EEE8FF;
  --peach-soft: #FFE8D6;
  --r: 18px;
  --head: 'Mali', 'Quicksand', system-ui, sans-serif;
  --body: 'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  font-weight: 600;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--pink-dk); text-decoration: none; }
a:hover { color: var(--pink); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, .head { font-family: var(--head); font-weight: 700; line-height: 1.2; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
.page { padding: 28px 0 70px; }
.row { display: flex; flex-wrap: wrap; gap: 18px; }
.grow { flex: 999 1 520px; min-width: 0; }
.side { flex: 1 1 300px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.center { text-align: center; }
.muted { color: var(--ink2); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.title { font-size: 34px; }
.sub { font-size: 22px; }

/* ---------- header ---------- */
.topbar { background: var(--paper); border-bottom: 2px solid var(--line); position: sticky; top: 0; z-index: 30; }
.topbar .wrap { max-width: 1260px; min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--head); font-size: 25px; font-weight: 800; color: var(--ink); }
.brand:hover { color: var(--ink); }
.brand b { color: var(--pink); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { display: inline-flex; align-items: center; gap: 6px; padding: 9px 11px; border-radius: 14px; font-weight: 700; font-size: 15px; color: var(--ink2); }
.nav a:hover { background: var(--yel-soft); color: var(--ink); }
.nav a.on { background: var(--pink-soft); color: var(--pink-dk); }
.nav .cnt { background: var(--pink); color: #fff; font-size: 12px; border-radius: 999px; padding: 1px 7px; }
.tl { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 8px 0; }
.tr { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.pillstat { display: inline-flex; align-items: center; gap: 5px; background: var(--yel-soft); border: 2px solid var(--yel-mid); border-radius: 999px; padding: 4px 12px 4px 8px; font-weight: 800; font-size: 15px; color: var(--yel-ink); }
.pillstat.pk { background: var(--pink-soft); border-color: var(--pink-mid); color: var(--pink-dk); }
.ava { width: 40px; height: 40px; border-radius: 50%; background: var(--pink-mid); color: var(--pink-dk); display: inline-flex; align-items: center; justify-content: center; font-family: var(--head); font-size: 19px; font-weight: 800; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--pink-mid); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 16px; border: 2px solid var(--line2); background: var(--paper); color: var(--ink); font-weight: 800; font-size: 16px; white-space: nowrap; box-shadow: 0 3px 0 var(--line2); transition: transform .06s, box-shadow .06s; }
.btn:hover { background: #FFFBF6; color: var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line2); }
.btn-pink { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-dk); }
.btn-pink:hover { background: #F46A99; color: #fff; }
.btn-pink:active { box-shadow: 0 2px 0 var(--pink-dk); }
.btn-yel { background: var(--yel); border-color: var(--yel); color: var(--yel-ink); box-shadow: 0 4px 0 var(--yel-dk); }
.btn-yel:hover { background: #FFDA66; color: var(--yel-ink); }
.btn-mint { background: var(--mint); border-color: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-dk); }
.btn-mint:hover { background: #38C28F; color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn-ghost:hover { background: var(--pink-soft); }
.btn-lg { min-height: 56px; padding: 0 28px; font-size: 18px; border-radius: 18px; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; box-shadow: 0 2px 0 var(--line2); }
.btn-block { width: 100%; }
.ibtn { width: 44px; height: 44px; border-radius: 14px; border: 2px solid var(--line2); background: var(--paper); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; box-shadow: 0 2px 0 var(--line2); }
.ibtn:hover { background: var(--yel-soft); }
.ibtn.sm { width: 36px; height: 36px; border-radius: 11px; }
.ibtn.say { color: var(--pink); }

/* ---------- cards ---------- */
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 24px; padding: 22px 24px; }
.card h2 { font-size: 22px; margin-bottom: 12px; }
.chead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.chead h2 { margin: 0; }
.bar { height: 12px; background: #F6E9EE; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pink); border-radius: 99px; }
.bar.mint > i { background: var(--mint); }
.bar.yel > i { background: var(--yel); }
.bar.thin { height: 8px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.tag-mint { background: var(--mint-soft); color: var(--mint-dk); }
.tag-pink { background: var(--pink-soft); color: var(--pink-dk); }
.tag-yel { background: var(--yel-soft); color: var(--yel-ink); }
.tag-soft { background: #F4EEF1; color: var(--ink2); }
.note { border-radius: 16px; padding: 14px 16px; font-size: 15px; }
.note-yel { background: var(--yel-soft); border: 2px solid var(--yel-mid); color: var(--yel-ink); }
.note-pink { background: var(--pink-soft); border: 2px solid var(--pink-mid); color: var(--pink-dk); }
.note-mint { background: var(--mint-soft); border: 2px solid #B6E9D4; color: var(--mint-dk); }

/* ---------- landing ---------- */
.hero { padding: 48px 0 30px; }
.hero .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 30px; }
.hero h1 { font-size: 52px; line-height: 1.08; margin: 14px 0 14px; }
.hero h1 em { font-style: normal; color: var(--pink); }
.hero .lead { font-size: 19px; color: var(--ink2); max-width: 520px; margin-bottom: 26px; font-weight: 600; }
.blob { position: relative; flex: 1 1 360px; display: flex; justify-content: center; align-items: center; min-height: 340px; }
.blob::before { content: ''; position: absolute; width: 340px; height: 340px; border-radius: 46% 54% 52% 48%; background: var(--yel-mid); }
.blob::after { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: var(--pink-mid); right: 12%; top: 4%; }
.blob > * { position: relative; z-index: 1; }
.float-word { position: absolute; z-index: 2; background: #fff; border: 2px solid var(--line2); border-radius: 14px; padding: 6px 12px; font-family: var(--head); font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 var(--line2); }
.feat { flex: 1 1 250px; min-width: 0; border-radius: 24px; padding: 24px; border: 2px solid; }
.feat .em { font-size: 40px; line-height: 1; }
.feat h3 { font-size: 22px; margin: 12px 0 6px; }
.feat p { color: var(--ink2); font-size: 15px; }
.lvl { display: flex; gap: 8px; flex-wrap: wrap; }
.lvl span { display: inline-flex; align-items: center; justify-content: center; min-width: 54px; height: 46px; padding: 0 12px; border-radius: 14px; border: 2px dashed var(--line2); color: var(--ink3); font-weight: 800; background: #fff; }
.lvl span.on { border: 2px solid var(--pink); background: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--pink-dk); }

/* ---------- auth ---------- */
.auth { min-height: calc(100vh - 72px); display: flex; align-items: flex-start; justify-content: center; padding: 34px 20px 60px; gap: 30px; flex-wrap: wrap; }
.auth-card { width: 100%; max-width: 480px; background: #fff; border: 2px solid var(--line); border-radius: 28px; padding: 28px; }
.seg { display: flex; background: #FBF0F3; border-radius: 16px; padding: 5px; margin-bottom: 22px; }
.seg button { flex: 1; min-height: 44px; border: none; border-radius: 12px; background: transparent; color: var(--ink2); font-weight: 800; }
.seg button.on { background: #fff; color: var(--pink-dk); box-shadow: 0 2px 0 var(--line2); }
.field { margin-bottom: 15px; }
.field > label { display: block; font-weight: 800; margin-bottom: 6px; font-size: 15px; }
.field .hint { font-size: 13px; color: var(--ink2); margin-top: 5px; font-weight: 600; }
.inp, .sel, .ta { width: 100%; min-height: 48px; border: 2px solid var(--line2); border-radius: 14px; padding: 0 14px; font-size: 16px; background: #fff; font-weight: 600; }
.ta { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.5; }
.inp:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px var(--pink-soft); }
.inp.big { min-height: 58px; font-size: 20px; }
.two { display: flex; gap: 12px; flex-wrap: wrap; }
.two > * { flex: 1 1 160px; min-width: 0; }
.ferr { background: var(--red-soft); border: 2px solid #FFC6C1; color: var(--red-dk); border-radius: 14px; padding: 11px 14px; font-size: 15px; margin-bottom: 15px; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink2); margin-bottom: 18px; }
.chk input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--pink); }

/* ---------- home ---------- */
.hello { background: var(--yel-soft); border: 2px solid var(--yel-mid); border-radius: 28px; padding: 26px 28px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.bubble { position: relative; background: #fff; border: 2px solid var(--yel-mid); border-radius: 22px; padding: 14px 18px; font-size: 18px; margin-bottom: 18px; }
.bubble::before { content: ''; position: absolute; left: -12px; top: 22px; border: 10px solid transparent; border-right-color: var(--yel-mid); border-left: 0; }
.bubble::after { content: ''; position: absolute; left: -8px; top: 24px; border: 8px solid transparent; border-right-color: #fff; border-left: 0; }
.goal { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; flex: none; }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-size: 22px; }
.gtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.gtile { display: flex; flex-direction: column; gap: 6px; border-radius: 22px; padding: 18px; border: 2px solid; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.06); transition: transform .1s; min-height: 140px; }
.gtile:hover { transform: translateY(-3px); color: var(--ink); }
.gtile .em { font-size: 38px; line-height: 1; }
.gtile .t { font-family: var(--head); font-size: 20px; font-weight: 700; }
.gtile .d { font-size: 13px; color: var(--ink2); }
.gtile .st { margin-top: auto; font-size: 15px; letter-spacing: 1px; }
.g-cards { background: var(--pink-soft); border-color: var(--pink-mid); }
.g-listen { background: var(--sky-soft); border-color: #BFE0FA; }
.g-memory { background: var(--yel-soft); border-color: var(--yel-mid); }
.g-spell { background: var(--mint-soft); border-color: #B6E9D4; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.stk { aspect-ratio: 1; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; background: #FBF3F5; border: 2px dashed var(--line2); }
.stk.got { background: #fff; border: 2px solid var(--yel-mid); box-shadow: 0 3px 0 var(--yel-mid); }
.stk.no { filter: grayscale(1); opacity: .35; font-size: 26px; }
.stat { flex: 1 1 170px; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 16px 18px; }
.stat .k { font-size: 14px; color: var(--ink2); }
.stat .v { font-family: var(--head); font-size: 32px; font-weight: 800; line-height: 1.15; }

/* ---------- learning path ---------- */
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 30px; }
.path::before { content: ''; position: absolute; top: 40px; bottom: 60px; left: 50%; border-left: 5px dotted var(--pink-mid); transform: translateX(-50%); }
.pnode { position: relative; display: flex; flex-direction: column; align-items: center; width: 220px; text-align: center; color: var(--ink); transform: translateX(var(--x, 0)); }
.pnode:hover { color: var(--ink); }
.pnode .dot { position: relative; width: 92px; height: 92px; border-radius: 50%; background: #fff; border: 4px solid var(--line2); display: flex; align-items: center; justify-content: center; font-size: 42px; box-shadow: 0 6px 0 var(--line2); transition: transform .12s; }
.pnode:hover .dot { transform: scale(1.06); }
.pnode.done .dot { border-color: var(--mint); box-shadow: 0 6px 0 var(--mint-dk); background: var(--mint-soft); }
.pnode.cur .dot { border-color: var(--pink); box-shadow: 0 6px 0 var(--pink-dk), 0 0 0 10px rgba(242,85,139,0.15); background: var(--pink-soft); animation: bob 1.6s ease-in-out infinite; }
.pnode.rev .dot { border-radius: 26px; background: var(--yel-soft); border-color: var(--yel); box-shadow: 0 6px 0 var(--yel-dk); }
.pnode .ok { position: absolute; right: -4px; top: -4px; width: 30px; height: 30px; border-radius: 50%; background: var(--mint); color: #fff; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; }
.pnode .lab { margin-top: 12px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 5px 12px; }
.pnode .lab .u { font-size: 12.5px; color: var(--ink2); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.pnode .lab .n { font-family: var(--head); font-size: 17px; font-weight: 700; line-height: 1.2; }
.pnode .stars { font-size: 14px; letter-spacing: 2px; margin-top: 3px; }
.pnode .here { position: absolute; top: -34px; background: var(--pink); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* ---------- unit ---------- */
.ubanner { border-radius: 28px; padding: 24px 28px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; border: 2px solid rgba(0,0,0,0.05); }
.ubanner .ic { width: 96px; height: 96px; border-radius: 28px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 52px; flex: none; box-shadow: 0 5px 0 rgba(0,0,0,0.07); }
.ubanner .u { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.ubanner h1 { font-size: 36px; }
.utabs { display: flex; gap: 10px; margin: 22px 0 22px; flex-wrap: wrap; }
.utabs a { flex: 1 1 180px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 18px; background: #fff; border: 2px solid var(--line2); color: var(--ink2); font-family: var(--head); font-size: 20px; font-weight: 700; box-shadow: 0 3px 0 var(--line2); }
.utabs a .num { width: 28px; height: 28px; border-radius: 50%; background: #F4EEF1; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
.utabs a.on { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-dk); }
.utabs a.on .num { background: #fff; color: var(--pink); }
.utabs a .ck { color: var(--mint); }
.utabs a.on .ck { color: #fff; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.vc { background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 16px 12px 14px; text-align: center; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .1s; width: 100%; }
.vc:hover { transform: translateY(-3px); border-color: var(--pink-mid); }
.vc .pic { height: 66px; display: flex; align-items: center; justify-content: center; font-size: 50px; line-height: 1; margin-bottom: 8px; }
.vc .w { font-family: var(--head); font-size: 20px; font-weight: 700; line-height: 1.15; }
.vc .m { font-size: 14px; color: var(--ink2); margin-top: 3px; }
.ptile { display: inline-flex; align-items: center; justify-content: center; min-width: 62px; height: 56px; padding: 0 10px; border-radius: 16px; background: var(--yel-mid); color: var(--yel-ink); font-family: var(--head); font-size: 24px; font-weight: 800; line-height: 1; }
.ptile.lg { min-width: 120px; height: 104px; font-size: 44px; border-radius: 26px; }
.ptile.xs { min-width: 40px; height: 34px; font-size: 16px; border-radius: 10px; }
.pat { background: #fff; border: 2px solid var(--line); border-radius: 26px; padding: 22px 24px; }
.pat .formula { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.pat .q, .pat .a { font-family: var(--head); font-size: 23px; font-weight: 700; padding: 8px 16px; border-radius: 16px; }
.pat .q { background: var(--pink-soft); color: var(--pink-dk); }
.pat .a { background: var(--yel-soft); color: var(--yel-ink); }
.pat .arrow { font-size: 22px; color: var(--ink3); }
.chat { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #FFFBF6; border-radius: 18px; }
.chat .lnq, .chat .lna { display: flex; align-items: center; gap: 10px; }
.chat .lna { justify-content: flex-end; }
.chat .bq, .chat .ba { padding: 9px 15px; border-radius: 18px; font-size: 17px; max-width: 80%; }
.chat .bq { background: #fff; border: 2px solid var(--pink-mid); border-bottom-left-radius: 4px; }
.chat .ba { background: var(--yel-mid); border-bottom-right-radius: 4px; }
.tipbox { display: flex; gap: 14px; align-items: flex-start; background: var(--mint-soft); border: 2px solid #B6E9D4; border-radius: 22px; padding: 16px 18px; }
.tipbox ul { margin: 4px 0 0; padding-left: 20px; }
.tipbox li { margin: 4px 0; }
.exc { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 14px 16px; flex-wrap: wrap; box-shadow: 0 3px 0 var(--line); }
.exc .ic { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex: none; }
.exc .inf { flex: 1 1 240px; min-width: 0; }
.exc .t { font-family: var(--head); font-size: 19px; font-weight: 700; line-height: 1.2; }
.exc .s { font-size: 14px; color: var(--ink2); }
.exc .stars { font-size: 18px; letter-spacing: 2px; }

/* ---------- player ---------- */
.ptop { background: #fff; border-bottom: 2px solid var(--line); }
.ptop .wrap { display: flex; align-items: center; gap: 16px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
.ptop .mid { flex: 1 1 280px; min-width: 0; }
.ptop .ttl { font-weight: 800; margin-bottom: 7px; }
.qcard { background: #fff; border: 2px solid var(--line); border-radius: 28px; padding: 30px 32px; }
.qkind { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--pink-dk); background: var(--pink-soft); padding: 4px 12px; border-radius: 99px; margin-bottom: 16px; }
.qtext { font-family: var(--head); font-size: 28px; font-weight: 600; line-height: 1.4; margin-bottom: 24px; }
.qtext .blank { display: inline-block; min-width: 80px; border-bottom: 4px solid var(--pink-mid); margin: 0 4px; text-align: center; color: var(--pink-dk); }
.opts { display: flex; flex-direction: column; gap: 11px; }
.opts.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.opt { width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; border: 2px solid var(--line2); background: #fff; border-radius: 18px; padding: 14px 16px; font-size: 19px; font-weight: 700; box-shadow: 0 3px 0 var(--line2); }
.opt:hover { border-color: var(--pink-mid); }
.opt .k { width: 34px; height: 34px; flex: none; border-radius: 11px; background: #FBF0F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--ink2); }
.opt.sel { border-color: var(--pink); background: var(--pink-soft); color: var(--pink-dk); box-shadow: 0 3px 0 var(--pink-mid); }
.opt.sel .k { background: var(--pink); color: #fff; }
.opt.right { border-color: var(--mint); background: var(--mint-soft); color: var(--mint-dk); box-shadow: 0 3px 0 #B6E9D4; }
.opt.right .k { background: var(--mint); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red-dk); box-shadow: 0 3px 0 #FFC6C1; }
.opt.wrong .k { background: var(--red); color: #fff; }
.opt[disabled] { cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.bank span { padding: 6px 13px; border-radius: 11px; background: var(--lav-soft); color: #5A3FB0; font-weight: 800; }
.build { min-height: 70px; border: 3px dashed var(--pink-mid); border-radius: 20px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; background: #FFFAFB; }
.build.empty::before { content: 'Bấm các từ bên dưới để ghép câu nhé'; color: var(--ink3); padding: 0 8px; }
.wchips { display: flex; flex-wrap: wrap; gap: 9px; }
.wchip { min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line2); background: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 3px 0 var(--line2); }
.wchip:hover { border-color: var(--pink); }
.wchip.used { visibility: hidden; }
.wchip.in { background: var(--yel-soft); border-color: var(--yel-mid); box-shadow: 0 3px 0 var(--yel-mid); }
.fb { margin-top: 20px; border-radius: 20px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.fb.ok { background: var(--mint-soft); border: 2px solid #B6E9D4; color: var(--mint-dk); }
.fb.no { background: var(--red-soft); border: 2px solid #FFC6C1; color: var(--red-dk); }
.fb .h { font-family: var(--head); font-weight: 700; font-size: 22px; }
.qfoot { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 22px; margin-top: 24px; border-top: 2px dashed var(--line); flex-wrap: wrap; }
.passage { background: var(--yel-soft); border: 2px solid var(--yel-mid); border-radius: 24px; padding: 20px 22px; }
.passage .txt { font-size: 16px; line-height: 1.8; white-space: pre-line; color: #4A3810; font-weight: 600; }
.passage h3 { font-size: 19px; color: var(--yel-ink); }
.match { display: flex; gap: 18px; flex-wrap: wrap; }

/* ---------- games ---------- */

/* ---------- misc ---------- */

}

.stage { position: relative; height: 440px; border-radius: 28px; overflow: hidden; border: 3px solid var(--sky); }

.balloon { position: absolute; left: 0; top: 0; width: 130px; height: 150px; border: none; background: none; padding: 0; cursor: pointer; }
.balloon::before { content: ''; position: absolute; left: 10px; top: 0; width: 110px; height: 128px; border-radius: 50% 50% 48% 48%; background: var(--c); box-shadow: inset -10px -12px 0 rgba(0,0,0,0.08); }

.maze { position: relative; display: grid; grid-template-columns: repeat(11, 1fr); aspect-ratio: 11 / 9; background: var(--mint-soft); border: 3px solid var(--mint); border-radius: 22px; overflow: hidden; }

/* =====================================================================

/* ===================== Đập chuột chũi (whack) ===================== */
.whack-wrap { max-width: 640px; }
.whack-wrap #whack-prompt.whack-new .gprompt { animation: bounceIn .45s; }
.whack-reveal { text-align: center; font-weight: 800; font-size: 19px; color: var(--red-dk); min-height: 0; margin: -6px auto 8px; }
.whack-reveal.whack-on { background: var(--red-soft); border-radius: 14px; padding: 6px 12px; max-width: 420px; animation: bounceIn .45s; }
.whack-reveal b { color: var(--mint-dk); font-family: var(--head); font-size: 22px; }
.whack-field { --hw: 138px; position: relative; border-radius: 30px; padding: 84px 16px 12px; overflow: hidden; background-color: #5BCB6E; background-position: center top; background-size: 100% auto; background-repeat: no-repeat; box-shadow: 0 14px 34px rgba(59, 42, 58, .16), inset 0 0 0 5px rgba(255, 255, 255, .45); touch-action: manipulation; -webkit-user-select: none; user-select: none; }
@media (pointer: fine) { .whack-field, .whack-field .whack-hole { cursor: none; } }
.whack-grid { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; }
/* lỗ: ảnh lỗ sau + chuột (cắt theo miệng lỗ) + vành lỗ trước; mọi kích thước tính theo --hw (bề rộng ảnh lỗ) */
.whack-hole { position: relative; height: calc(var(--hw) * 1.02); border: 0; padding: 0; background: none; -webkit-tap-highlight-color: transparent; }
.whack-hole:focus-visible { outline: 4px solid #FFE14D; outline-offset: 2px; border-radius: 18px; }
.whack-back, .whack-front { position: absolute; left: 50%; bottom: 0; width: var(--hw); height: calc(var(--hw) * .6364); margin-left: calc(var(--hw) / -2); pointer-events: none; }
.whack-front { z-index: 2; }
.whack-mask { position: absolute; left: -10px; right: -10px; bottom: calc(var(--hw) * .191); height: calc(var(--hw) * 1.2); pointer-events: none;
  -webkit-mask: linear-gradient(#000, #000) top / 100% calc(100% - var(--hw) * .118) no-repeat, radial-gradient(calc(var(--hw) * .3455) calc(var(--hw) * .118) at 50% calc(100% - var(--hw) * .118), #000 97%, transparent 100%);
  mask: linear-gradient(#000, #000) top / 100% calc(100% - var(--hw) * .118) no-repeat, radial-gradient(calc(var(--hw) * .3455) calc(var(--hw) * .118) at 50% calc(100% - var(--hw) * .118), #000 97%, transparent 100%); }
.whack-mole { position: absolute; left: 50%; bottom: calc(var(--hw) * -.118); width: var(--hw); height: calc(var(--hw) * 1.0273); margin-left: calc(var(--hw) / -2); transform: translateY(105%); transition: transform .22s cubic-bezier(.3, 1.4, .6, 1); }
.whack-mole.whack-up { transform: translateY(0); }
.whack-mole:not(.whack-up) { transition-timing-function: ease-in; transition-duration: .18s; }
.whack-mimg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; transform-origin: 50% 100%; }
.whack-mhit { opacity: 0; }
.whack-gstar { position: absolute; right: -4%; top: -6%; width: 26%; height: auto; opacity: 0; }
.whack-mole.whack-gold .whack-mimg { filter: drop-shadow(0 0 5px #FFE14D) drop-shadow(0 0 10px #FFB703) saturate(1.2) hue-rotate(-12deg) brightness(1.08); }
.whack-mole.whack-gold .whack-gstar { opacity: 1; animation: twinkle 1s infinite; }
/* bảng chữ: phủ đúng khung trắng của tấm biển (x30 y16 w160 h64 / 220×226), tự nới rộng khi từ dài */
.whack-sign { position: absolute; left: 50%; top: calc(var(--hw) * .0727); transform: translateX(-50%); box-sizing: border-box; min-width: calc(var(--hw) * .7273); max-width: calc(var(--hw) * 1.2); min-height: calc(var(--hw) * .2909); display: flex; align-items: center; justify-content: center;
  background: #FFFBF0; border: 3px solid #3B2A3A; border-radius: calc(var(--hw) * .041); padding: 1px 5px; font-family: var(--head); font-weight: 800; font-size: 21px; line-height: 1.02; color: #3B2A3A; text-align: center; overflow-wrap: break-word; }
.whack-sign.whack-l, .whack-sign.whack-xl { font-size: 19px; }
.whack-mole.whack-gold .whack-sign { background: #FFE98A; }
.whack-mole.whack-hit { transition: transform .12s ease-in; }
.whack-mole.whack-hit .whack-mnorm { opacity: 0; }
.whack-mole.whack-hit .whack-mhit { opacity: 1; animation: whack-squash .35s both; }
.whack-mole.whack-hit .whack-sign { transform: translateX(-50%) translateY(3px) rotate(-10deg); transition: transform .12s; }
.whack-mole.whack-bad .whack-mimg { filter: grayscale(.6) brightness(.9); }
.whack-mole.whack-bad .whack-sign { background: #FFE4E2; border-color: #C53D3D; color: #C53D3D; animation: whack-signshake .4s; }
.whack-fx { position: absolute; left: 50%; top: 40%; width: 0; height: 0; pointer-events: none; z-index: 3; }
.whack-fx span { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); animation: whack-star .8s ease-out forwards; }
.whack-fxs { display: block; width: 28px; height: 28px; } .whack-fxs.sm { width: 18px; height: 18px; }
.whack-bonk { position: absolute; left: 0; top: -40px; transform: translate(-50%, -50%); font-family: var(--head); font-weight: 800; font-size: 26px; color: #FFE14D; -webkit-text-stroke: 1.5px #C93A6C; text-shadow: 0 3px 0 #C93A6C; white-space: nowrap; animation: whack-bonktxt .8s both; }
.whack-ham { position: absolute; left: 0; top: 0; width: 84px; height: 84px; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .15s; }
.whack-ham.whack-on { opacity: 1; }
.whack-ham img { width: 100%; height: 100%; display: block; transform-origin: 62% 86%; filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .25)); }
.whack-ham img.whack-swing { animation: whack-swing .28s ease-out; }
@keyframes whack-signshake { 0%, 100% { transform: translateX(-50%); } 25% { transform: translateX(calc(-50% - 7px)) rotate(-4deg); } 75% { transform: translateX(calc(-50% + 7px)) rotate(3deg); } }
@keyframes whack-squash { 0% { transform: scale(1, 1); } 30% { transform: scale(1.3, .55); } 60% { transform: scale(.92, 1.08); } 100% { transform: scale(1.1, .8); } }
@keyframes whack-star { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.4); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(140deg); } }
@keyframes whack-bonktxt { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 25% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%) scale(1); } }
@keyframes whack-swing { 0% { transform: rotate(0); } 45% { transform: rotate(-42deg) scale(1.05); } 100% { transform: rotate(0); } }
@media (max-width: 640px) {
  .whack-field { --hw: min(112px, 29vw); padding: 34px 6px 10px; border-radius: 24px; }
  .whack-grid { gap: 2px 4px; }
  .whack-sign { font-size: 19px; padding: 1px 3px; border-width: 2.5px; }
  .whack-sign.whack-l, .whack-sign.whack-xl { font-size: 18px; }
  .whack-ham { display: none; }
}
}

.monster-superban { left: 24%; top: 10px; font-size: 26px; animation: monster-ban 1.4s .1s both; }

/* ---------- KART ---------- */
.kart-wrap { max-width: 980px; }
.kart-stage { --kh: 356px; --cw: 134px; position: relative; height: var(--kh); border-radius: 28px; overflow: hidden; background: #8FCBFF; box-shadow: 0 14px 34px rgba(59, 42, 58, .16), inset 0 0 0 4px rgba(255, 255, 255, .6); user-select: none; }

.kart-track { position: absolute; inset: 0; background-repeat: repeat-x; background-size: auto 100%; background-position: 0 0; will-change: background-position; }
.kart-start, .kart-finish { position: absolute; left: 0; top: calc(var(--kh) * .4417); height: calc(var(--kh) * .4611); width: 26px; will-change: transform; pointer-events: none; z-index: 1; }

.kart-flag { position: absolute; left: -12px; bottom: 100%; margin-bottom: -6px; width: 64px; height: auto; transform-origin: 24% 95%; animation: kartWave 1.2s ease-in-out infinite alternate; }

/* xe (sprite 260×190, bánh chạm đất ở y≈182) — đáy xe đặt đúng tâm làn */
.kart-car { position: absolute; left: 0; width: var(--cw); height: calc(var(--cw) * .7308); will-change: transform; z-index: 2; pointer-events: none; }
.kart-car.kl0 { top: calc(var(--kh) * .5222 - var(--cw) * .7); z-index: 2; } .kart-car.kl1 { top: calc(var(--kh) * .675 - var(--cw) * .7); z-index: 3; } .kart-car.kl2 { top: calc(var(--kh) * .8278 - var(--cw) * .7); z-index: 4; }
.kart-body { position: absolute; inset: 0; }
.kart-img { display: block; width: 100%; height: 100%; }
.kart-tag { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); white-space: nowrap; background: rgba(43, 34, 51, .78); color: #fff; font-family: var(--head); font-size: 13px; font-weight: 700; padding: 1px 9px; border-radius: 999px; z-index: 3; }

/* lửa turbo (sprite 240×120, gốc lửa bên phải) gắn vào ống xả ở đuôi xe */
.kart-flame { position: absolute; right: 90%; top: 42%; width: 62%; height: 31%; opacity: 0; transform: scaleX(.3); transform-origin: right center; transition: opacity .15s, transform .15s; }
.kart-fimg { display: block; width: 100%; height: 100%; animation: kartFlick .12s linear infinite alternate; }
@keyframes kartFlick { from { transform: scale(.92, .86); } to { transform: scale(1.05, 1.06); } }

.kart-dust { position: absolute; left: 0; top: 84%; width: 24px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, .55); animation: kartDust .6s ease-out infinite; }
@keyframes kartDust { from { transform: translateX(0) scale(.4); opacity: .8; } to { transform: translateX(-34px) scale(1.4); opacity: 0; } }
.kart-spin { animation: kartSpin 1s cubic-bezier(.3, .7, .4, 1); }
@keyframes kartSpin { 0% { transform: rotate(0); } 70% { transform: rotate(-640deg) translateY(-6px); } 100% { transform: rotate(-720deg); } }
.kart-lines { position: absolute; left: 0; right: 0; top: 44%; bottom: 9%; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 5;

.kart-pod { position: relative; width: 340px; height: calc(340px * .71875); animation: kartRise .5s cubic-bezier(.3, 1.4, .5, 1) both; }

.kart-map { display: flex; align-items: center; gap: 10px; margin: 12px auto 4px; max-width: 760px; background: #fff; border-radius: 999px; padding: 6px 14px; box-shadow: 0 4px 14px rgba(59, 42, 58, .12); }

/* ---------- FISHING ---------- */
.fishing-wrap { max-width: 980px; }
/* biển: sprite sea-bg (1000×600, mặt nước y≈72) phủ ngang, đặt cách mép trên 30px → mặt nước ≈ 100px */
.fishing-stage { position: relative; height: 500px; border-radius: 28px; overflow: hidden; background-color: #E8C59E; background-repeat: no-repeat; background-position: center 30px; background-size: 100% auto; box-shadow: 0 14px 34px rgba(59, 42, 58, .18), inset 0 0 0 4px rgba(255, 255, 255, .5); user-select: none; }
.fishing-stage::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(#A9D8FF, #BFE3FF); z-index: 0; pointer-events: none; }
.fishing-cloud { position: absolute; top: 4px; width: 92px; height: auto; opacity: .95; animation: fishingCloud 40s linear infinite; pointer-events: none; z-index: 1; }
.fishing-cloud.a { left: 8%; } .fishing-cloud.b { top: 14px; left: 58%; width: 70px; animation-duration: 55s; animation-delay: -20s; }
@keyframes fishingCloud { from { transform: translateX(-140px); } to { transform: translateX(110vw); } }
.fishing-bub { position: absolute; bottom: -40px; height: auto; opacity: .85; animation: fishingBub 7s linear infinite; pointer-events: none; z-index: 1; }
@keyframes fishingBub { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } 50% { transform: translate(10px, -200px); } 85% { opacity: .8; } 100% { transform: translate(-6px, -360px); opacity: 0; } }
.fishing-weed { position: absolute; bottom: -8px; width: auto; transform-origin: bottom center; animation: fishingSway 3.2s ease-in-out infinite alternate; pointer-events: none; z-index: 1; }
@keyframes fishingSway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
/* thuyền (sprite 280×230): đáy thuyền y≈200 nằm trên mặt nước */
.fishing-boat { position: absolute; left: 0; top: 4px; width: 140px; z-index: 6; pointer-events: none; }
.fishing-boatimg { display: block; width: 100%; height: auto; }
.fishing-boat.bob { animation: fishingBob .6s ease-out; }
@keyframes fishingBob { 0%, 100% { margin-top: 0; } 40% { margin-top: 6px; } 70% { margin-top: -3px; } }
.fishing-sign.pop { animation: bounceIn .45s; }
.fishing-wrap .fishing-sign { margin-bottom: 14px; }
.fishing-gl { position: absolute; right: -8px; top: -16px; display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #FFE45C, #FFB703); color: #6B4A00; font-size: 13px; font-weight: 800; padding: 1px 10px 1px 4px; border-radius: 999px; box-shadow: 0 2px 0 rgba(0, 0, 0, .15); animation: bounceIn 1s infinite; }
.fishing-glimg { width: 30px; height: auto; }
/* dây câu thả từ đầu cần (266,22); lưỡi câu (sprite 60×160, dây vào ở (30,0)) treo ở cuối dây */
.fishing-line { position: absolute; left: 0; top: 20px; width: 2.5px; height: 0; margin-left: -1.25px; background: #3B2A3A; z-index: 7; opacity: 0; pointer-events: none; }
.fishing-line.on { opacity: 1; }
.fishing-hook { position: absolute; left: 50%; top: 100%; width: 18px; height: auto; margin: -2px 0 0 -9px; display: block; }
/* cá (sprite 170×130, quay mặt sang phải; thân cá quanh x≈100) — chữ đặt trên thân cá */
.fishing-fish { position: absolute; left: 0; top: 0; z-index: 3; border: none; padding: 0; background: none; cursor: pointer; will-change: transform; -webkit-tap-highlight-color: transparent; }
.fishing-in { position: relative; display: block; width: 124px; animation: fishingSwim .5s ease-in-out infinite alternate; }
@keyframes fishingSwim { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
.fishing-img { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .18)); }
.fishing-fish.fl .fishing-img { transform: scaleX(-1); }
.fishing-in b { position: absolute; left: 57%; top: 58%; transform: translate(-50%, -50%); background: #fff; color: #2B2233; font-family: var(--head); font-weight: 700; font-size: 20px; line-height: 1.1; padding: 3px 10px; border-radius: 12px; border: 2.5px solid #3B2A3A; white-space: nowrap; box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.fishing-in b.l { font-size: 18px; }
.fishing-fish.fl .fishing-in b { left: 43%; }
.fishing-in em { position: absolute; top: -4px; left: 50%; font-style: normal; font-size: 13px; font-weight: 800; color: #6B4A00; background: #FFF6B0; border: 2px solid #3B2A3A; border-radius: 999px; padding: 0 7px; }
.fishing-fish.gold { filter: drop-shadow(0 0 10px rgba(255, 226, 80, .95)); }
.fishing-fish:hover .fishing-img { filter: brightness(1.08) drop-shadow(0 4px 4px rgba(0, 0, 0, .18)); }
.fishing-fish.hint { filter: drop-shadow(0 0 12px #FFF) drop-shadow(0 0 6px #FFE45C); }
.fishing-fish.hint .fishing-in { animation: fishingHint .35s ease-in-out infinite alternate; }
@keyframes fishingHint { from { transform: scale(1); } to { transform: scale(1.12); } }
.fishing-fish.bad .fishing-img { filter: grayscale(.7) sepia(.5) hue-rotate(-40deg) saturate(2.5) brightness(.9); }
.fishing-fish.bad .fishing-in b { color: #C53D3D; background: #FFE4E2; }
.fishing-fish.bad, .fishing-fish.chomp { pointer-events: none; }
.fishing-fish.hooked .fishing-in { animation: fishingWiggle .12s linear infinite alternate; }
@keyframes fishingWiggle { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
.fishing-fish.gone { transition: opacity .3s, filter .3s; opacity: 0; }
/* cá mập (sprite 260×160 quay mặt sang trái) */
.fishing-shk { width: 176px; height: auto; display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .2)); }
.fishing-shark .fishing-in { width: auto; }
.fishing-shark:not(.fl) .fishing-shk { transform: scaleX(-1); }
.fishing-fish.chomp .fishing-in { animation: fishingChomp .15s linear infinite alternate; }
@keyframes fishingChomp { from { transform: scale(1, 1); } to { transform: scale(1.12, .9); } }
.fishing-splash { position: absolute; top: 100px; width: 0; height: 0; z-index: 7; pointer-events: none; }
.fishing-splash i { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #E2F6FF; border: 2px solid #3B2A3A; animation: fishingDrop .8s ease-out forwards; }
.fishing-splash i:nth-child(1) { --dx: -46px; --dy: -40px; } .fishing-splash i:nth-child(2) { --dx: -20px; --dy: -62px; } .fishing-splash i:nth-child(3) { --dx: 0px; --dy: -72px; }
.fishing-splash i:nth-child(4) { --dx: 22px; --dy: -60px; } .fishing-splash i:nth-child(5) { --dx: 46px; --dy: -38px; }
@keyframes fishingDrop { 0% { transform: translate(0, 0) scale(.6); opacity: 1; } 60% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; } 100% { transform: translate(calc(var(--dx) * 1.3), 10px) scale(.5); opacity: 0; } }
.fishing-worm { display: inline-flex; transition: opacity .3s, filter .3s; }
.fishing-worm.off { opacity: .3; filter: grayscale(1); }
@media (max-width: 760px) {
  .fishing-stage { height: 470px; background-size: auto 440px; }
  .fishing-boat { width: 106px; top: 12px; }
  .fishing-in { width: 104px; }
  .fishing-in b { font-size: 18px; padding: 2px 8px; }
  .fishing-shk { width: 140px; }
  .fishing-cloud { width: 70px; } .fishing-cloud.b { width: 54px; }
}
}
@media (prefers-reduced-motion: reduce) {
  .kart-fimg, .kart-dust, .kart-flag, .fishing-bub, .fishing-weed, .fishing-cloud, .fishing-in { animation: none !important; }
}
/* lớp chung .me (menu tài khoản) không được ảnh hưởng tới xe / bục / chấm bản đồ */
.kart-car.me { display: block; border: 0; padding: 0; border-radius: 0; gap: 0; }
.kart-pod-c.me { display: flex; border: 0; padding: 0; border-radius: 0; }
.kart-dot.me { padding: 0; gap: 0; }

/* ===== Ôn luyện đề (giao diện theo mẫu GS7 First Midterm) – mọi lớp có tiền tố ol- để không đụng giao diện app ===== */
.olx{--bg:#fdf1f6;--card:#ffffff;--soft:#fdf6f9;--ink:#3a2029;--muted:#8d6b79;--line:#f5d9e5;--line-2:#efc8da;--dash:#eec4d7;
  --brand:#c2185b;--brand-2:#e0548c;--brand-ink:#ffffff;--brand-tint:#fdeaf1;--ok:#0d7a52;--ok-bg:#e4f6ee;--ok-line:#9bd9bf;
  --no:#c0341c;--no-bg:#fdeae5;--no-line:#f0b3a3;--lav:#efeafb;--lav-ink:#5b47a8;--mint:#e3f4f1;--mint-ink:#17705f;
  --sign:#fffdf7;--sign-line:#d9cdb4;--wait:#8a5a00;--wait-bg:#fff4d6;--wait-line:#f1d17a;
  --display:"Baloo 2","Mali",system-ui,sans-serif;--body:"Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;--en:"Nunito","Quicksand",Georgia,serif;
  --sh:0 1px 2px rgba(122,30,70,.05),0 8px 22px rgba(122,30,70,.07);--r:16px;
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;min-height:70vh}
.olx *{box-sizing:border-box}
.olx :where(button,input,textarea,select){font:inherit}
:where(.olx) :where(button,input,textarea,select){color:inherit}
.olx h1,.olx h2,.olx h3,.olx h4{margin:0;text-wrap:balance;font-family:var(--display);font-weight:700;letter-spacing:.2px;color:inherit}
.ol-shell{max-width:1040px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}

.ol-hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 26px 22px;
  background:linear-gradient(135deg,var(--brand-2) 0%,var(--brand) 62%);color:var(--brand-ink);box-shadow:var(--sh)}
.ol-hero .ol-blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.ol-hero .ol-b1{width:290px;height:290px;right:-70px;top:-110px}
.ol-hero .ol-b2{width:180px;height:180px;right:60px;bottom:-110px}
.ol-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.ol-hero h1{font-size:clamp(28px,6.4vw,44px);line-height:1.08;margin:6px 0 10px;font-weight:800}
.ol-hero p{margin:0;max-width:62ch;font-size:15px;opacity:.96}
.ol-hero p b{font-weight:800}
.ol-hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ol-hchip{border:0;background:rgba(255,255,255,.94);color:var(--brand);font-family:var(--display);font-weight:700;
  font-size:13.5px;padding:7px 15px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1)}

.ol-info{background:var(--card);border:2px dashed var(--dash);border-radius:var(--r);padding:20px}
.ol-fgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.ol-fgrid.ol-two{grid-template-columns:2.4fr 1fr}}
.ol-f label{display:block;font-family:var(--display);font-weight:700;color:var(--brand);font-size:15px;margin-bottom:6px}
.ol-f input{width:100%;padding:11px 15px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--soft);color:var(--ink)}
.ol-f input::placeholder{color:var(--muted);opacity:.75}
.ol-f input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.ol-rules{margin:16px 0 0;padding-left:20px;display:grid;gap:7px;font-size:14.5px}
.ol-rules li::marker{color:var(--brand)}
.ol-rules b{font-weight:800}

.ol-nav{position:sticky;top:var(--oltop,0px);z-index:20;background:var(--bg);
  border-bottom:2px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:9px}
.ol-nav-in{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:thin}
.ol-nchip{flex:none;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-family:var(--display);
  font-weight:700;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ol-nchip[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ol-nchip:hover:not([aria-current="true"]){border-color:var(--brand);color:var(--brand)}
.ol-tally{flex:none;margin-left:auto;padding-left:12px;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ol-tally b{color:var(--brand);font-weight:800}
.ol-tally .ol-sc{margin-left:10px;padding-left:10px;border-left:1.5px solid var(--line-2)}

.ol-part{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.ol-part-h{display:flex;gap:12px;align-items:flex-start}
.ol-badge{flex:none;min-width:42px;height:34px;padding:0 9px;border-radius:11px;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13.5px}
.ol-part-h h2{font-size:20px}
.ol-part-h span{display:block;font-family:var(--body);font-size:13.5px;font-weight:400;color:var(--muted);margin-top:1px}
.ol-lead{margin:0;font-size:14.5px;color:var(--muted)}
.ol-lead em{font-family:var(--en);font-style:italic;color:var(--ink)}

.ol-rule{border:2px dashed var(--dash);border-radius:14px;padding:16px;background:var(--soft)}
.ol-rule h3{font-size:16px;color:var(--brand);margin-bottom:10px}
.ol-forms{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:10px}
@media (min-width:660px){.ol-forms.ol-pair{grid-template-columns:1fr 1fr}}
.ol-form{border-radius:10px;padding:8px 14px;font-family:var(--en);font-weight:700;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.ol-form.ol-a{background:var(--lav);color:var(--lav-ink)}
.ol-form.ol-b{background:var(--mint);color:var(--mint-ink)}
.ol-form i.ol-fl{font-family:var(--display);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-right:9px;font-weight:700}
.ol-rule ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
.ol-rule li::marker{color:var(--brand)}
.ol-rule b{color:var(--brand);font-weight:800}
.ol-rule em{font-family:var(--en);font-style:italic}
.ol-rule del{opacity:.75}

.ol-psg{border:1.5px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:15px 17px;background:var(--soft)}
.ol-psg h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:9px}
.ol-psg p{font-family:var(--en);font-size:15.5px;line-height:1.78;margin:0 0 11px;text-align:justify;hyphens:auto}
.ol-psg p:last-child{margin-bottom:0}
.ol-psg b{color:var(--brand);font-weight:800}
.ol-psg u{text-underline-offset:3px}

.ol-sign{display:flex;align-items:center;gap:16px;border:2px solid var(--sign-line);background:var(--sign);
  border-radius:14px;padding:14px 16px}
.ol-sign svg{flex:none}
.ol-sign span{font-family:var(--en);font-size:14.5px;color:var(--muted)}
.ol-sign span b{display:block;font-family:var(--display);font-size:15px;color:var(--ink);margin-bottom:2px}

.ol-qs{display:flex;flex-direction:column}
.ol-q{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:15px 0;border-bottom:1.5px dashed var(--line);scroll-margin-top:84px}
.ol-q:last-child{border-bottom:0;padding-bottom:2px}
.ol-qn{width:32px;height:30px;border-radius:999px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.ol-q.ol-ok .ol-qn{background:var(--ok-bg);color:var(--ok)}
.ol-q.ol-no .ol-qn{background:var(--no-bg);color:var(--no)}
.ol-qb{min-width:0;display:flex;flex-direction:column;gap:10px}
.ol-stem{font-family:var(--en);font-size:15.5px;line-height:1.6}
.ol-opts{display:grid;gap:7px}
@media (min-width:640px){.ol-opts.ol-two{grid-template-columns:1fr 1fr}.ol-opts.ol-four{grid-template-columns:repeat(4,1fr)}}
.ol-opt{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;padding:9px 13px;border:1.5px solid var(--line-2);
  background:var(--card);border-radius:12px;cursor:pointer;font-family:var(--en);font-size:15px;line-height:1.45;min-width:0}
.ol-opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-tint)}
.ol-opt:disabled{cursor:default}
.ol-opt kbd{font-family:var(--display);font-weight:800;font-size:12px;flex:none;width:20px;height:20px;border-radius:7px;
  border:1.5px solid var(--line-2);display:grid;place-items:center;margin-top:1px;background:var(--soft)}
.ol-opt.ol-pick{border-color:var(--brand);background:var(--brand-tint)}
.ol-opt.ol-pick kbd{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ol-opt.ol-right{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.ol-opt.ol-right kbd{background:var(--ok);border-color:var(--ok);color:#fff}
.ol-opt.ol-wrong{border-color:var(--no-line);background:var(--no-bg);color:var(--no)}
.ol-opt.ol-wrong kbd{background:var(--no);border-color:var(--no);color:#fff}
.ol-opt u{text-underline-offset:3px;text-decoration-thickness:2px}

.ol-field{display:grid;gap:6px;min-width:0}
.ol-field label{font-size:13px;color:var(--muted);font-weight:600}
.ol-field label b{color:var(--brand)}
.ol-field input{width:100%;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--soft);
  color:var(--ink);font-family:var(--en);font-size:15px}
.ol-field input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.ol-field input:disabled{opacity:.8}

.ol-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ol-btn{border:2px solid var(--brand);background:var(--card);color:var(--brand);font-family:var(--display);font-weight:700;
  font-size:14px;padding:7px 18px;border-radius:12px;cursor:pointer}
.ol-btn:hover:not(:disabled){background:var(--brand);color:var(--brand-ink)}
.ol-btn:disabled{opacity:.42;cursor:not-allowed}
.ol-btn.ol-solid{background:var(--brand);color:var(--brand-ink)}
.ol-btn.ol-solid:hover:not(:disabled){filter:brightness(1.08)}
.ol-btn.ol-ghost{border-color:var(--line-2);color:var(--muted)}
.ol-btn.ol-ghost:hover{border-color:var(--brand);color:var(--brand);background:transparent}
.ol-tag{font-family:var(--display);font-weight:800;font-size:13px}
.ol-tag.ol-ok{color:var(--ok)}.ol-tag.ol-no{color:var(--no)}

.ol-fb{border-radius:12px;padding:12px 14px;border:1.5px solid var(--line);background:var(--soft);font-size:14.5px}
.ol-fb.ol-ok{border-color:var(--ok-line);background:var(--ok-bg)}
.ol-fb.ol-no{border-color:var(--no-line);background:var(--no-bg)}
.ol-fb .ol-k{display:block;font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px}
.ol-fb .ol-model{font-family:var(--en);font-size:15px;line-height:1.55}
.ol-fb .ol-model b{font-weight:800}
.ol-fb.ol-ok .ol-model b{color:var(--ok)} .ol-fb.ol-no .ol-model b{color:var(--no)}
.ol-fb .ol-why{margin-top:9px;padding-top:9px;border-top:1.5px dashed var(--line-2)}
.ol-fb em{font-family:var(--en);font-style:italic}
.ol-fb b{font-weight:800}
.ol-th{margin-top:10px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--card);padding:11px 13px}
.ol-th h4{margin:0 0 8px;font-family:var(--display);font-size:14px;font-weight:800;color:var(--brand)}
.ol-th .ol-forms{margin-bottom:8px}
.ol-th ul{margin:0;padding-left:19px;display:grid;gap:5px;font-size:14px}
.ol-th li::marker{color:var(--brand)}

.ol-submit{background:var(--card);border:2px dashed var(--dash);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.ol-submit h2{font-size:20px;color:var(--brand)}
.ol-big{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ol-big b{font-family:var(--display);font-size:50px;font-weight:800;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.ol-big span{font-size:14.5px;color:var(--muted)}
.ol-bd{display:grid;gap:3px}
.ol-bd-r{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;font-size:14px;padding:8px 0;border-top:1.5px dashed var(--line)}
.ol-bd-r b{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.ol-meter{grid-column:1/-1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.ol-meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:4px}
.ol-miss{font-size:14px;color:var(--muted)}

.ol-mailbox{display:grid;gap:9px}

.ol-fb .ol-fix{margin-top:8px;font-family:var(--en)}

.ol-hist{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}

.ol-ed input,.ol-ed textarea,.ol-ed select{width:100%;padding:7px 10px;border:1.5px solid var(--line-2);border-radius:9px;background:var(--soft);font-family:var(--en);font-size:14px}

.ol-ed .ol-row{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center}

.ol-ck{display:flex;gap:8px;align-items:center;font-size:14.5px}
.ol-steps{display:grid;gap:6px;font-size:14.5px}
.ol-steps .ol-done{color:var(--ok)}.ol-steps .ol-now{color:var(--brand);font-weight:700}.ol-steps .ol-bad{color:var(--no)}

.ol-drop.ol-over{background:var(--brand-tint)}

.ol-form i:not(.ol-fl),.ol-form em{font-family:var(--en);font-style:italic;font-weight:600}
:where(.olx) a{color:var(--brand)}
